# /etc/nginx/sites-available/catogarizer
# Enable with: sudo ln -s /etc/nginx/sites-available/catogarizer /etc/nginx/sites-enabled/
# Plain HTTP only - TLS is terminated by the Cloudflare tunnel.
#
# Server layout (adjust the paths if you prefer another place):
#   /var/www/catogarizer/public/      <- contents of the repo's website/public/ folder
#   /var/www/catogarizer/downloads/   <- Catogarizer-Setup.exe (not in git)
# Both are filled by website/deploy/deploy.ps1.

server {
    listen 80;
    listen [::]:80;
    # Use the hostname the tunnel points at, e.g. catogarizer.example.com
    server_name catogarizer.example.com;

    root /var/www/catogarizer/public;
    index index.html;

    # Behind cloudflared the peer is always localhost; take the real client IP from Cloudflare.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/catogarizer.access.log;
    error_log  /var/log/nginx/catogarizer.error.log;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Installer downloads: served as a file download, never cached (so a new version shows up at once).
    location /downloads/ {
        alias /var/www/catogarizer/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets: cache for a week.
    location ~* \.(css|ico|svg|png|jpg|jpeg|gif|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Never serve dotfiles.
    location ~ /\. { deny all; }
}
